
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Fix project structure
        run: |
          cp lib/main.dart /tmp/my_main.dart
          cp pubspec.yaml /tmp/my_pubspec.yaml
          cp android/app/google-services.json /tmp/google-services.json

          flutter create . --project-name zx_ff_tour --org com.zx.fftour

          cp /tmp/my_main.dart lib/main.dart
          cp /tmp/my_pubspec.yaml pubspec.yaml
          cp /tmp/google-services.json android/app/google-services.json

      - name: Fix Gradle configuration
        run: |
          python3 << 'PY'
          import re

          # Gradle Wrapper: 8.0
          p = "android/gradle/wrapper/gradle-wrapper.properties"
          t = open(p).read()
          t = re.sub(
              r'gradle-[0-9.]+-(all|bin)\.zip',
              'gradle-8.0-all.zip',
              t
          )
          open(p, "w").write(t)

          # Android Gradle Plugin and Kotlin versions
          p = "android/settings.gradle"
          t = open(p).read()

          t = re.sub(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+)["\'][^"\']+["\']',
              r'\g<1>"8.1.0"',
              t
          )

          t = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+)["\'][^"\']+["\']',
              r'\g<1>"1.9.0"',
              t
          )

          if "com.google.gms.google-services" not in t:
              t = t.replace(
                  'plugins {',
                  'plugins {\n    id "com.google.gms.google-services" version "4.4.0" apply false',
                  1
              )

          open(p, "w").write(t)

          # Apply Firebase plugin
          p = "android/app/build.gradle"
          t = open(p).read()

          if "com.google.gms.google-services" not in t:
              t = re.sub(
                  r'(plugins\s*\{)',
                  r'\1\n    id "com.google.gms.google-services"',
                  t,
                  count=1
              )

          open(p, "w").write(t)

          print("Gradle 8.0 and Firebase configuration fixed!")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ZX-FF-TOUR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
