name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Fix project structure
        run: |
          cp lib/main.dart /tmp/my_main.dart
          cp pubspec.yaml /tmp/my_pubspec.yaml
          cp android/app/google-services.json /tmp/google-services.json
          flutter create . --project-name zx_ff_tour --org com.zx.fftour
          cp /tmp/my_main.dart lib/main.dart
          cp /tmp/my_pubspec.yaml pubspec.yaml
          cp /tmp/google-services.json android/app/google-services.json
          # Firebase - সঠিক জায়গায়, settings.gradle এ আর হাত দিবো না
          sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle || true
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ZX-FF-TOUR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
