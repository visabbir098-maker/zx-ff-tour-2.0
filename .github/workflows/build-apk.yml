name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Fix project structure
        run: |
          cp lib/main.dart /tmp/my_main.dart
          cp pubspec.yaml /tmp/my_pubspec.yaml
          cp android/app/google-services.json /tmp/google-services.json
          flutter create . --project-name zx_ff_tour --org com.zx.fftour
          cp /tmp/my_main.dart lib/main.dart
          cp /tmp/my_pubspec.yaml pubspec.yaml
          cp /tmp/google-services.json android/app/google-services.json
          python3 << 'PY'
          # settings.gradle - plugins block এর ভিতরে ঢুকাও
          p = "android/settings.gradle"
          t = open(p).read()
          if "google-services" not in t:
              t = t.replace('id "com.android.application"', 'id "com.google.gms.google-services" version "4.4.2" apply false\n    id "com.android.application"')
              open(p, "w").write(t)
          # app/build.gradle - plugins block এর ভিতরে ঢুকাও
          p2 = "android/app/build.gradle"
          t2 = open(p2).read()
          if "google-services" not in t2:
              t2 = t2.replace('id "dev.flutter.flutter-gradle-plugin"', 'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"')
              # যদি kotlin syntax হয়
              t2 = t2.replace("id 'dev.flutter.flutter-gradle-plugin'", "id 'dev.flutter.flutter-gradle-plugin'\n    id 'com.google.gms.google-services'")
              open(p2, "w").write(t2)
          print("Firebase plugin added OK")
          PY
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ZX-FF-TOUR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
